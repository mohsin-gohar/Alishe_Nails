# ==============================================================================
# Alishe Nails - Production Nginx Server Block Configuration
# ==============================================================================
# Place in: /etc/nginx/sites-available/alishenails
# Symlink:  ln -s /etc/nginx/sites-available/alishenails /etc/nginx/sites-enabled/
# Test:     nginx -t
# Reload:   systemctl reload nginx
# ==============================================================================

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name alishenails.com www.alishenails.com;
    return 301 https://alishenails.com$request_uri;
}

# Redirect www to non-www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.alishenails.com;

    ssl_certificate /etc/letsencrypt/live/alishenails.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alishenails.com/privkey.pem;

    return 301 https://alishenails.com$request_uri;
}

# Primary HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name alishenails.com;

    root /var/www/alishe-nails/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 25M;

    # SSL Certificates & Parameters
    ssl_certificate /etc/letsencrypt/live/alishenails.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alishenails.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Enterprise Security Headers (Defense-in-Depth)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # --------------------------------------------------------------------------
    # P0 Security Rule: Prohibit PHP / Script Execution in Upload Directories
    # --------------------------------------------------------------------------
    location ~* ^/(storage|images|videos)/.*\.php$ {
        deny all;
        return 404;
    }

    # Static Assets Long-term Caching (Vite build artifacts)
    location ~* \.(?:css|js|woff2?|svg|webp|png|jpg|jpeg|ico|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Laravel Front Controller Routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # PHP-FPM FastCGI Handler
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # FastCGI buffer settings to prevent 502 bad gateway on large responses
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60;
    }

    # Block access to hidden files (.env, .git, .htaccess)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
