name: Tests

on:
  push:
    branches: [main, 'audit/**']
  pull_request:

jobs:
  sqlite-suite:
    name: PHPUnit (SQLite) + Pint + Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Laravel Pint
        run: vendor/bin/pint --test app tests

      - name: Build frontend
        run: npm run build

      - name: PHPUnit (SQLite)
        run: php -d error_reporting=E_ALL vendor/bin/phpunit

  mysql-suite:
    name: PHPUnit + concurrency harness (MySQL, real row locks)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: alishe_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: base64:CI-dummy-key-will-be-generated
      BCRYPT_ROUNDS: '4'
      CACHE_STORE: array
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: alishe_test
      DB_USERNAME: root
      DB_PASSWORD: root
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      APP_MAINTENANCE_DRIVER: file
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: pdo_mysql

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Migrate (MySQL)
        run: php artisan migrate:fresh --force

      - name: PHPUnit (MySQL)
        run: php -d error_reporting=E_ALL vendor/bin/phpunit

      - name: Concurrency harness (real MySQL row locks)
        run: php tests/Concurrency/run.php
